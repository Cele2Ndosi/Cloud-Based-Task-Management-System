<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A simple cloud-based task management application.">
    <title>Cloud Task Manager</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="app-container">
        <header class="app-header">
            <h1>Cloud Task Manager</h1>
            <p>Organize your tasks in one place.</p>
        </header>

        <!--
            Status banner: used from Iteration 5 onward to show
            "Loading...", "Signed in", or error messages.
            Placed here now so index.html never needs editing again.
        -->
        <div id="status-banner" class="status-banner hidden" role="status"></div>

        <section class="task-input-section">
            <form id="task-form">
                <label for="task-input">New task</label>
                <div class="input-row">
                    <input
                        id="task-input"
                        name="task"
                        type="text"
                        placeholder="Enter a task..."
                        maxlength="200"
                        autocomplete="off"
                        required
                    >
                    <button id="submit-button" type="submit">Add Task</button>
                </div>
            </form>
        </section>

        <section class="task-section">
            <div class="section-header">
                <h2>My Tasks</h2>
                <span id="task-count">0 tasks</span>
            </div>
            <ul id="task-list" class="task-list" aria-live="polite"></ul>
            <p id="empty-message" class="empty-message">No tasks yet. Add your first task!</p>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
